; lorawan-payload-codec: one ESP32 environment (sensor node sketch, no radio library bound yet)
; plus `native` for the host tests of lib/payload_codec.
;
; Flash:         pio run -e esp32dev -t upload && pio device monitor
; Host tests:    pio test -e native        (or `make test-core`, plain cc)

[platformio]
default_envs = esp32dev

[env]
test_framework = custom
build_flags =
    -Wall -Wextra

[env:esp32dev]
platform = espressif32@^6.9.0   ; Arduino-ESP32 core 2.0.x
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
test_ignore = *                  ; unit tests run on the host only

[env:native]
; Runs test/test_native/test_codec.c (self-contained asserts, see test/minitest.h).
platform = native
build_flags =
    ${env.build_flags}
    -std=c11
build_src_filter = -<*>
lib_compat_mode = off
